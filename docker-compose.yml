services:
  mysql:
    image: mysql:8.4
    container_name: mysql_encurt
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shortdb
      MYSQL_USERNAME: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
